# ========================================================
# AI RESUME LAB — Production Nginx Configuration
# Place in: /etc/nginx/sites-available/ai-resume-lab
# Symlink to: /etc/nginx/sites-enabled/
# ========================================================

server {
    listen 80;
    server_name your-ec2-domain-or-ip.com;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is installed)
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Access and Error logs
    access_log /var/log/nginx/ai_resume_lab_access.log;
    error_log /var/log/nginx/ai_resume_lab_error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # API Proxy to Flask Gunicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for longer LLM analyses
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }

    # Option A: If serving frontend from EC2 Nginx instead of S3
    # location / {
    #     root /home/ubuntu/ai-resume-lab/frontend;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    # Option B: If frontend is on S3, allow CORS headers
    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
