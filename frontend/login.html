<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — AI Resume Lab</title>
  <meta name="description" content="Sign in to AI Resume Lab to access your resume analysis, job matching, and interview prep tools."/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>
<div class="bg-animated"></div>
<div class="grid-overlay"></div>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="logo-icon">⚡</div>AI RESUME LAB
  </a>
  <div class="nav-actions" style="margin-left:auto;">
    <a href="register.html" class="btn btn-ghost btn-sm">Create Account</a>
    <a href="analyzer.html" class="btn btn-primary btn-sm">Try Free</a>
  </div>
</nav>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(var(--nav-height) + 40px) 24px 60px;">
  <div style="width:100%;max-width:420px;">

    <!-- Brand -->
    <div class="text-center mb-32" style="margin-bottom:32px;">
      <div style="width:60px;height:60px;border-radius:var(--radius-md);background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 16px;box-shadow:var(--shadow-btn);">⚡</div>
      <h1 style="font-family:var(--font-display);font-size:1.6rem;font-weight:800;margin-bottom:6px;">Welcome Back</h1>
      <p style="font-size:0.875rem;color:var(--text-secondary);">Sign in to your AI Resume Lab account</p>
    </div>

    <!-- Card -->
    <div class="card card-lg">
      <!-- Social Logins -->
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
        <button class="btn btn-secondary w-full" onclick="Toast.info('Demo Mode', 'Social login not configured in this demo.')">
          <span>🔵</span> Continue with Google
        </button>
        <button class="btn btn-secondary w-full" onclick="Toast.info('Demo Mode', 'Social login not configured in this demo.')">
          <span>🐙</span> Continue with GitHub
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.08);"></div>
        <span style="font-size:0.75rem;color:var(--text-muted);">or sign in with email</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.08);"></div>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon">📧</span>
              <input type="email" class="form-input" id="login-email" autocomplete="email"
                placeholder="you@example.com" required/>
            </div>
          </div>

          <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <label class="form-label" for="login-password">Password</label>
              <a href="#" style="font-size:0.78rem;color:var(--accent-cyan);">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" id="login-password" autocomplete="current-password"
                placeholder="Enter your password" required/>
              <button type="button" class="input-toggle" id="toggle-password" aria-label="Show password">👁</button>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="remember-me" style="width:16px;height:16px;accent-color:var(--accent-cyan);cursor:pointer;"/>
            <label for="remember-me" style="font-size:0.825rem;color:var(--text-secondary);cursor:pointer;">Remember me</label>
          </div>

          <div id="login-error" style="font-size:0.8rem;color:var(--accent-red);min-height:18px;"></div>

          <button type="submit" class="btn btn-primary w-full btn-lg">
            🔑 Sign In
          </button>
        </div>
      </form>

      <!-- Demo Credentials -->
      <div style="margin-top:16px;padding:12px;background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.2);border-radius:var(--radius-sm);">
        <p style="font-size:0.78rem;font-weight:600;color:var(--accent-cyan);margin-bottom:4px;">🧪 Demo Credentials</p>
        <p style="font-size:0.75rem;color:var(--text-secondary);">Email: <code style="color:var(--accent-cyan);">test@demo.com</code> | Password: <code style="color:var(--accent-cyan);">demo123</code></p>
        <button type="button" class="btn btn-outline btn-sm w-full" style="margin-top:8px;" onclick="fillDemo()">Use Demo Credentials</button>
      </div>
    </div>

    <p class="text-center mt-24" style="margin-top:24px;font-size:0.875rem;color:var(--text-secondary);">
      Don't have an account?
      <a href="register.html" style="color:var(--accent-cyan);font-weight:600;">Create one free</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
  // Toggle password visibility
  document.getElementById('toggle-password')?.addEventListener('click', function() {
    const input = document.getElementById('login-password');
    input.type = input.type === 'password' ? 'text' : 'password';
    this.textContent = input.type === 'password' ? '👁' : '🙈';
  });

  function fillDemo() {
    document.getElementById('login-email').value = 'test@demo.com';
    document.getElementById('login-password').value = 'demo123';
    Toast.info('Demo Filled', 'Click Sign In to continue with demo account.');
  }
</script>
</body>
</html>
